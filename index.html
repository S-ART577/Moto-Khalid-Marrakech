<link rel="icon" href="logo.png" type="image/png">
<style>
  :root{
    --red:#d81f1f;
    --black:#0d0d0d;
    --gray:#1a1a1a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 70%);
    color:#fff;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 40px 20px 60px;
  }
  .logo{
    width:170px;
    height:auto;
    margin-bottom:18px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  }
  h1{
    font-size:26px;
    letter-spacing:1px;
    text-align:center;
  }
  .subtitle{
    color:#bbb;
    font-size:14px;
    margin-top:6px;
    margin-bottom:34px;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .links{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  a.btn{
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--gray);
    border:1px solid #2c2c2c;
    color:#fff;
    text-decoration:none;
    padding:16px 20px;
    border-radius:14px;
    font-size:16px;
    font-weight:600;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  a.btn:active{
    transform: scale(0.97);
  }
  a.btn:hover{
    border-color: var(--red);
    background:#222;
  }
  a.btn .icon{
    width:26px;
    height:26px;
    flex-shrink:0;
  }
  .footer{
    margin-top:50px;
    color:#555;
    font-size:12px;
    text-align:center;
  }
</style>
</head>
